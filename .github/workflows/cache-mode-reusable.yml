name: Temporary reusable cache mode canary
on:
  workflow_call:
    inputs:
      cache_key:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  write-canary:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create a synthetic marker
        run: printf 'cache-mode-canary\n' > marker.txt
      - name: Attempt cache save
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: marker.txt
          key: ${{ inputs.cache_key }}
      - name: Report only whether the step completed
        run: echo 'synthetic_cache_canary=finished'
